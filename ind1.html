<div class="carousel">

    <button class="carousel-btn prev">&#10094;</button>

    <div class="carousel-track">
        <div class="carousel-slide">
            <img src="/img/ChatGPT Image Mar 9, 2026, 07_25_16 PM.webp" alt="">
        </div>

        <div class="carousel-slide">
            <img src="/img/Gemini_Generated_Image_2dxloe2dxloe2dxl.png" alt="">
        </div>

        <div class="carousel-slide">
            <img src="/img/imagem-limpeza.webp" alt="">
        </div>
    </div>

    <button class="carousel-btn next">&#10095;</button>

</div>

<style>
    .carousel {
        position: relative;
        width: 100%;
        max-width: 900px;
        margin: auto;
        overflow: hidden;
    }

    .carousel-track {
        display: flex;
        transition: transform 0.6s ease;
    }

    .carousel-slide {
        min-width: 100%;
    }

    .carousel-slide img {
        width: 100%;
        display: block;
    }

    .carousel-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        font-size: 30px;
        padding: 10px 15px;
        cursor: pointer;
    }

    .prev {
        left: 10px;
    }

    .next {
        right: 10px;
    }
</style>

<script>
    const track = document.querySelector(".carousel-track")
    const slides = document.querySelectorAll(".carousel-slide")

    let index = 0

    function updateCarousel() {
        track.style.transform = `translateX(-${index * 100}%)`
    }

    document.querySelector(".next").onclick = () => {
        index++
        if (index >= slides.length) {
            index = 0
        }
        updateCarousel()
    }

    document.querySelector(".prev").onclick = () => {
        index--
        if (index < 0) {
            index = slides.length - 1
        }
        updateCarousel()
    }
</script>
